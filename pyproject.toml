[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appcategorizer"
version = "0.1.0"
description = "Classify applications into broad software categories from public metadata sources."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "appcategorizer contributors" },
]
dependencies = [
    "beautifulsoup4",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "playwright",
    "rapidfuzz>=3.6.0",
    "rich",
    "sentence-transformers",
]

[project.scripts]
appcategorizer = "appcategorizer.cli:main_sync"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
gui = [
    "ttkbootstrap>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["appcategorizer*"]
